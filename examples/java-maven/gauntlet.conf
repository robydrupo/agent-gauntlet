# gauntlet.conf — Java / Maven.
#
# Reference wiring for the gauntlet: JUnit 5, Cucumber, ArchUnit, JaCoCo, CRAP, PIT.
# The runner (gauntlet.sh) is generic; everything Java-shaped is in here.

export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home}"
MVN="mvn -q -B"

# ---------------------------------------------------------------------------- referee
PROTECTED_FILES=(
  gauntlet.sh
  gauntlet.conf
  pom.xml
  tools/crap.py
  tools/check-referee.sh
  architecture.md
  src/test/java/wordwrap/architecture/ArchitectureTest.java
  src/test/java/wordwrap/acceptance/RunCucumberTest.java
  docs/stories/*.md
)
REFEREE_MANIFEST=".gauntlet/referee.sha256"

# ---------------------------------------------------------------------------- gates
GATES=(
  "compile|compile"
  "architecture|architecture rules (ArchUnit vs architecture.md)"
  "unit|unit tests"
  "acceptance|acceptance / gherkin (Cucumber vs specs/*.feature)"
  "coverage|coverage 100% line + branch on domain (JaCoCo)"
  "crap|CRAP analysis"
  "mutation|mutation testing 100% kill rate on domain (PIT)"
  "qa|QA scripts (system driven from outside, golden output)"
)

gate_compile() {
  $MVN compile
}

gate_architecture() {
  # ArchUnit fails loudly when a rule matches no classes at all, which is correct but a
  # confusing first message. Say the useful thing instead.
  local n
  n=$(find src/main/java -name '*.java' 2>/dev/null | wc -l | tr -d ' ')
  if [ "$n" -eq 0 ]; then
    echo "  no production code in src/main/java — the Coder has not run"
    return 1
  fi
  $MVN test -Dtest=ArchitectureTest
}

gate_unit() {
  local n
  n=$(find src/test/java/wordwrap/domain -name '*Test.java' 2>/dev/null | wc -l | tr -d ' ')
  if [ "$n" -eq 0 ]; then
    echo "  no unit tests in src/test/java/wordwrap/domain — the Coder has not run"
    return 1
  fi
  $MVN test -Dtest='!ArchitectureTest,!RunCucumberTest'
}

gate_acceptance() {
  local n
  n=$(find specs -maxdepth 1 -name '*.feature' 2>/dev/null | wc -l | tr -d ' ')
  if [ "$n" -eq 0 ]; then
    echo "  no .feature files in specs/ — the Specifier has not run"
    return 1
  fi
  $MVN test -Dtest=RunCucumberTest
}

gate_coverage() {
  $MVN test jacoco:report && $MVN jacoco:check@check-coverage
}

gate_crap() {
  CRAP_THRESHOLD="${CRAP_THRESHOLD:-30}" CRAP_PACKAGE_PREFIX=wordwrap \
    tools/crap.py target/site/jacoco/jacoco.xml
}

gate_mutation() {
  $MVN test-compile org.pitest:pitest-maven:mutationCoverage
}

gate_qa() {
  local scripts rc=0
  scripts=$(find qa -maxdepth 1 -name '*.sh' 2>/dev/null | sort)
  if [ -z "$scripts" ]; then
    echo "  no executable QA scripts in qa/ — the QA agent has not run"
    return 1
  fi
  for s in $scripts; do
    echo "  running $s"
    bash "$s" || rc=1
  done
  return $rc
}

# ---------------------------------------------------------------------------- stages
STAGE_CODER="compile architecture unit acceptance"
STAGE_CLEANER="compile architecture unit acceptance coverage crap"
STAGE_HARDENER="compile architecture unit acceptance coverage crap mutation"
STAGE_QA="all"
